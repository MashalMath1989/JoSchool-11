<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>معاينة المستند</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #f1f5f9;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Kufi Arabic', 'Cairo', Tahoma, sans-serif;
      overflow: hidden;
      color: #0f172a;
    }

    #viewer-container {
      width: 100%;
      height: 100%;
      overflow-y: auto;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      padding: 16px 8px 84px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      scroll-behavior: smooth;
    }

    .page-card {
      background: #ffffff;
      border-radius: 8px;
      box-shadow: 0 4px 14px -2px rgba(15, 23, 42, 0.08), 0 2px 6px -2px rgba(15, 23, 42, 0.04);
      border: 1px solid #e2e8f0;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: transform 0.15s ease;
      max-width: 100%;
      overflow: hidden;
    }

    .page-card canvas {
      display: block;
      border-radius: 7px;
      max-width: 100%;
      height: auto;
    }

    .page-badge {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(15, 23, 42, 0.65);
      color: #ffffff;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 6px;
      pointer-events: none;
      backdrop-filter: blur(4px);
    }

    .page-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: #94a3b8;
      font-size: 12px;
      font-weight: 700;
      width: 100%;
      height: 100%;
      background: #fafafa;
    }

    .page-placeholder .mini-spinner {
      width: 24px;
      height: 24px;
      border: 3px solid #e2e8f0;
      border-top-color: #0284c7;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    /* Floating Toolbar */
    .floating-toolbar {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      color: #ffffff;
      padding: 6px 12px;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 12px 28px -4px rgba(0, 0, 0, 0.35), 0 4px 10px -2px rgba(0, 0, 0, 0.2);
      z-index: 100;
      font-size: 13px;
      font-weight: 700;
      border: 1px solid rgba(255, 255, 255, 0.15);
      user-select: none;
      max-width: 95vw;
    }

    .toolbar-btn {
      background: rgba(255, 255, 255, 0.12);
      border: none;
      color: #ffffff;
      padding: 6px 10px;
      border-radius: 9999px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, transform 0.1s;
      outline: none;
      line-height: 1;
    }

    .toolbar-btn:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    .toolbar-btn:active {
      transform: scale(0.94);
    }

    .toolbar-btn.icon-only {
      width: 32px;
      height: 32px;
      padding: 0;
      font-size: 15px;
    }

    .toolbar-btn svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .page-counter {
      padding: 0 4px;
      display: flex;
      align-items: center;
      gap: 4px;
      font-variant-numeric: tabular-nums;
      font-size: 12px;
      white-space: nowrap;
    }

    .divider {
      width: 1px;
      height: 18px;
      background: rgba(255, 255, 255, 0.2);
      margin: 0 2px;
    }

    /* Loading Overlay */
    #loading-overlay {
      position: fixed;
      inset: 0;
      background: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 200;
      transition: opacity 0.25s ease, visibility 0.25s;
    }

    #loading-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid #e2e8f0;
      border-top-color: #0284c7;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }

    .loading-text {
      font-size: 15px;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 6px;
    }

    .loading-subtext {
      font-size: 12px;
      color: #64748b;
      font-weight: 600;
      margin-bottom: 16px;
    }

    .quick-open-link {
      margin-top: 10px;
      font-size: 12px;
      font-weight: 700;
      color: #0284c7;
      text-decoration: underline;
      cursor: pointer;
      background: none;
      border: none;
      outline: none;
    }

    /* Error Overlay */
    #error-overlay {
      position: fixed;
      inset: 0;
      background: #f8fafc;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      z-index: 200;
    }

    .error-icon {
      width: 54px;
      height: 54px;
      background: #fee2e2;
      color: #ef4444;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 900;
      margin-bottom: 14px;
    }

    .error-title {
      font-size: 17px;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 8px;
    }

    .error-desc {
      font-size: 13px;
      color: #64748b;
      max-width: 320px;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    .error-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }

    .action-btn {
      padding: 10px 18px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.15s, transform 0.1s;
      border: none;
    }

    .action-btn.primary {
      background: #0284c7;
      color: #ffffff;
    }
    .action-btn.primary:hover {
      background: #0369a1;
    }

    .action-btn.secondary {
      background: #e2e8f0;
      color: #334155;
    }
    .action-btn.secondary:hover {
      background: #cbd5e1;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
  <script src="/pdfjs/pdf.min.js"></script>
</head>
<body>
  <!-- Loading Overlay -->
  <div id="loading-overlay">
    <div class="spinner"></div>
    <div class="loading-text" id="loading-title">جاري فتح وتجهيز المستند...</div>
    <div class="loading-subtext" id="loading-subtext">لحظات قليلة لتهيئة الصفحات</div>
    <button class="quick-open-link" id="btn-slow-fallback" style="display: none;" onclick="openDirect()">
      إذا تأخر التحميل، اضغط هنا لفتح الملف مباشرة ↗
    </button>
  </div>

  <!-- Error Overlay -->
  <div id="error-overlay">
    <div class="error-icon">!</div>
    <div class="error-title">تعذر عرض الملف في المعاينة</div>
    <div class="error-desc" id="error-message">يمكنك فتح الملف في تبويب خارجي أو تحميله مباشرة للاطلاع عليه.</div>
    <div class="error-actions">
      <a id="btn-external" href="#" target="_blank" rel="noopener noreferrer" class="action-btn primary">فتح الرابط المباشر ↗</a>
      <a id="btn-google-docs" href="#" class="action-btn secondary">العرض عبر عارض Google</a>
      <a id="btn-download" href="#" download class="action-btn secondary">تحميل الملف</a>
    </div>
  </div>

  <!-- Document Pages Container -->
  <div id="viewer-container"></div>

  <!-- Floating Control Bar -->
  <div class="floating-toolbar" id="toolbar" style="display: none;">
    <button class="toolbar-btn icon-only" id="btn-prev-page" title="الصفحة السابقة">
      <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
    </button>
    <div class="page-counter">
      <span id="current-page-num">1</span>
      <span>/</span>
      <span id="total-pages-num">-</span>
    </div>
    <button class="toolbar-btn icon-only" id="btn-next-page" title="الصفحة التالية">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </button>

    <div class="divider"></div>

    <button class="toolbar-btn icon-only" id="btn-zoom-out" title="تصغير">-</button>
    <button class="toolbar-btn" id="btn-zoom-fit" title="استعادة الحجم الأصلي" style="min-width: 44px; font-size: 11px;">100%</button>
    <button class="toolbar-btn icon-only" id="btn-zoom-in" title="تكبير">+</button>

    <div class="divider"></div>

    <button class="toolbar-btn icon-only" id="btn-download-bar" title="تحميل الملف">
      <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
    </button>
    <button class="toolbar-btn icon-only" id="btn-external-bar" title="فتح في نافذة خارجية">
      <svg viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
    </button>
  </div>

  <script>
    (function() {
      'use strict';

      // Configure Worker
      if (window.pdfjsLib) {
        pdfjsLib.GlobalWorkerOptions.workerSrc = '/pdfjs/pdf.worker.min.js';
      }

      const params = new URLSearchParams(window.location.search);
      const rawFileParam = (params.get('file') || '').trim();

      if (!rawFileParam) {
        showError('لم يتم تحديد رابط الملف.');
        return;
      }

      // Check if it's a Google Drive link; if so, redirect immediately to Google Drive preview!
      if (rawFileParam.includes('drive.google.com')) {
        let fileId = '';
        if (rawFileParam.includes('/file/d/')) {
          fileId = rawFileParam.split('/file/d/')[1]?.split('/')[0]?.split('?')[0] || '';
        } else if (rawFileParam.includes('id=')) {
          const match = rawFileParam.match(/[?&]id=([^&]+)/);
          if (match && match[1]) fileId = match[1];
        }
        if (fileId) {
          window.location.replace(`https://drive.google.com/file/d/${fileId}/preview`);
          return;
        }
      }

      // High-speed CDN resolver for GitHub raw URLs (jsDelivr edge cache)
      function getFastUrl(url) {
        const trimmed = url.trim();
        if (trimmed.includes('raw.githubusercontent.com/')) {
          const match = trimmed.match(/raw\.githubusercontent\.com\/([^/]+)\/([^/]+)\/([^/]+)\/(.+)/);
          if (match) {
            const [, owner, repo, branch, path] = match;
            return `https://cdn.jsdelivr.net/gh/${owner}/${repo}@${branch}/${path}`;
          }
        }
        return trimmed;
      }

      const primaryUrl = getFastUrl(rawFileParam);
      const secondaryUrl = rawFileParam;

      // DOM Elements
      const container = document.getElementById('viewer-container');
      const loadingOverlay = document.getElementById('loading-overlay');
      const btnSlowFallback = document.getElementById('btn-slow-fallback');
      const errorOverlay = document.getElementById('error-overlay');
      const errorMessage = document.getElementById('error-message');
      const btnExternal = document.getElementById('btn-external');
      const btnDownload = document.getElementById('btn-download');
      const btnGoogleDocs = document.getElementById('btn-google-docs');
      const toolbar = document.getElementById('toolbar');
      const currentPageNumEl = document.getElementById('current-page-num');
      const totalPagesNumEl = document.getElementById('total-pages-num');
      const btnPrevPage = document.getElementById('btn-prev-page');
      const btnNextPage = document.getElementById('btn-next-page');
      const btnZoomIn = document.getElementById('btn-zoom-in');
      const btnZoomOut = document.getElementById('btn-zoom-out');
      const btnZoomFit = document.getElementById('btn-zoom-fit');
      const btnDownloadBar = document.getElementById('btn-download-bar');
      const btnExternalBar = document.getElementById('btn-external-bar');

      // Bind direct links
      btnExternal.href = rawFileParam;
      btnDownload.href = rawFileParam;
      btnDownloadBar.onclick = () => {
        const a = document.createElement('a');
        a.href = rawFileParam;
        a.download = '';
        a.target = '_blank';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      };
      btnExternalBar.onclick = () => {
        window.open(rawFileParam, '_blank');
      };
      btnGoogleDocs.onclick = (e) => {
        e.preventDefault();
        window.location.replace(`https://docs.google.com/viewer?url=${encodeURIComponent(rawFileParam)}&embedded=true`);
      };

      window.openDirect = () => {
        window.open(rawFileParam, '_blank');
      };

      let pdfDoc = null;
      let totalPages = 0;
      let currentZoomMultiplier = 1.0;
      const pageElements = [];
      const pageViewports = [];
      const renderedPages = new Set();
      const renderingPages = new Set();
      const renderTasks = new Map();
      let observer = null;

      function showError(msg) {
        loadingOverlay.classList.add('hidden');
        errorOverlay.style.display = 'flex';
        if (msg) errorMessage.textContent = msg;
      }

      function getContainerWidth() {
        return Math.max(container.clientWidth - 24, 280);
      }

      // Render a specific page
      async function renderPage(pageNum) {
        if (renderedPages.has(pageNum) || renderingPages.has(pageNum)) return;
        const card = pageElements[pageNum];
        if (!card || !pdfDoc) return;

        renderingPages.add(pageNum);

        try {
          const page = await pdfDoc.getPage(pageNum);
          const baseViewport = pageViewports[pageNum] || page.getViewport({ scale: 1.0 });
          pageViewports[pageNum] = baseViewport;

          const baseWidth = getContainerWidth();
          const targetWidth = baseWidth * currentZoomMultiplier;
          const scale = targetWidth / baseViewport.width;
          const viewport = page.getViewport({ scale: scale });

          const dpr = Math.min(window.devicePixelRatio || 1, 1.5);

          // Prepare canvas
          card.innerHTML = '';
          card.style.width = `${Math.floor(viewport.width)}px`;
          card.style.height = `${Math.floor(viewport.height)}px`;

          const canvas = document.createElement('canvas');
          const context = canvas.getContext('2d', { alpha: false });
          canvas.width = Math.floor(viewport.width * dpr);
          canvas.height = Math.floor(viewport.height * dpr);
          canvas.style.width = `${Math.floor(viewport.width)}px`;
          canvas.style.height = `${Math.floor(viewport.height)}px`;
          context.scale(dpr, dpr);

          card.appendChild(canvas);

          // Page badge
          const badge = document.createElement('div');
          badge.className = 'page-badge';
          badge.textContent = `${pageNum}`;
          card.appendChild(badge);

          const renderTask = page.render({
            canvasContext: context,
            viewport: viewport,
          });

          renderTasks.set(pageNum, renderTask);
          await renderTask.promise;

          renderTasks.delete(pageNum);
          renderingPages.delete(pageNum);
          renderedPages.add(pageNum);
        } catch (err) {
          renderingPages.delete(pageNum);
          renderTasks.delete(pageNum);
          if (err && err.name !== 'RenderingCancelledException') {
            console.warn(`Error rendering page ${pageNum}:`, err);
          }
        }
      }

      // Setup placeholder cards for lazy loading
      function setupPlaceholders(firstPageViewport) {
        const baseWidth = getContainerWidth();
        const targetWidth = baseWidth * currentZoomMultiplier;
        const scale = targetWidth / firstPageViewport.width;
        const estimatedHeight = Math.floor(firstPageViewport.height * scale);
        const estimatedWidth = Math.floor(targetWidth);

        container.innerHTML = '';

        for (let i = 1; i <= totalPages; i++) {
          const card = document.createElement('div');
          card.className = 'page-card';
          card.id = `page-card-${i}`;
          card.dataset.pageNum = i;
          card.style.width = `${estimatedWidth}px`;
          card.style.height = `${estimatedHeight}px`;

          const placeholder = document.createElement('div');
          placeholder.className = 'page-placeholder';
          placeholder.innerHTML = `
            <div class="mini-spinner"></div>
            <div>صفحة ${i}</div>
          `;
          card.appendChild(placeholder);

          container.appendChild(card);
          pageElements[i] = card;
        }

        // Setup Intersection Observer for ultra-fast on-demand loading
        if ('IntersectionObserver' in window) {
          observer = new IntersectionObserver((entries) => {
            entries.forEach((entry) => {
              if (entry.isIntersecting) {
                const pageNum = parseInt(entry.target.dataset.pageNum, 10);
                if (pageNum) {
                  renderPage(pageNum);
                  // Preload next page
                  if (pageNum + 1 <= totalPages) {
                    renderPage(pageNum + 1);
                  }
                }
              }
            });
          }, {
            root: container,
            rootMargin: '500px 0px 500px 0px',
            threshold: 0.01,
          });

          for (let i = 1; i <= totalPages; i++) {
            observer.observe(pageElements[i]);
          }
        } else {
          // Fallback: render first 5 pages
          for (let i = 1; i <= Math.min(totalPages, 5); i++) {
            renderPage(i);
          }
        }
      }

      // Track current page on scroll
      function setupScrollTracking() {
        let scrollTimer = null;
        container.addEventListener('scroll', () => {
          if (scrollTimer) return;
          scrollTimer = setTimeout(() => {
            scrollTimer = null;
            const containerCenter = container.scrollTop + container.clientHeight / 2;
            let closestPage = 1;
            let minDistance = Infinity;

            for (let i = 1; i <= totalPages; i++) {
              const el = pageElements[i];
              if (!el) continue;
              const elCenter = el.offsetTop + el.clientHeight / 2;
              const dist = Math.abs(containerCenter - elCenter);
              if (dist < minDistance) {
                minDistance = dist;
                closestPage = i;
              }
            }

            currentPageNumEl.textContent = closestPage;
          }, 80);
        }, { passive: true });
      }

      // Page Navigation
      function scrollToPage(pageNum) {
        const target = Math.max(1, Math.min(pageNum, totalPages));
        const el = pageElements[target];
        if (el) {
          el.scrollIntoView({ behavior: 'smooth', block: 'start' });
          currentPageNumEl.textContent = target;
          renderPage(target);
        }
      }

      btnPrevPage.addEventListener('click', () => {
        const cur = parseInt(currentPageNumEl.textContent, 10) || 1;
        scrollToPage(cur - 1);
      });

      btnNextPage.addEventListener('click', () => {
        const cur = parseInt(currentPageNumEl.textContent, 10) || 1;
        scrollToPage(cur + 1);
      });

      // Zoom Handling
      function applyZoom(newMultiplier) {
        // Cancel in-flight renders
        renderTasks.forEach((task) => {
          try { task.cancel(); } catch (e) {}
        });
        renderTasks.clear();
        renderingPages.clear();
        renderedPages.clear();

        currentZoomMultiplier = Math.max(0.6, Math.min(newMultiplier, 2.5));
        btnZoomFit.textContent = `${Math.round(currentZoomMultiplier * 100)}%`;

        const baseWidth = getContainerWidth();
        const targetWidth = baseWidth * currentZoomMultiplier;

        for (let i = 1; i <= totalPages; i++) {
          const card = pageElements[i];
          if (!card) continue;
          const vp = pageViewports[i] || pageViewports[1];
          if (vp) {
            const scale = targetWidth / vp.width;
            card.style.width = `${Math.floor(targetWidth)}px`;
            card.style.height = `${Math.floor(vp.height * scale)}px`;
          }
          card.innerHTML = `
            <div class="page-placeholder">
              <div class="mini-spinner"></div>
              <div>صفحة ${i}</div>
            </div>
          `;
        }

        const curPage = parseInt(currentPageNumEl.textContent, 10) || 1;
        renderPage(curPage);
        if (curPage + 1 <= totalPages) renderPage(curPage + 1);
        if (curPage - 1 >= 1) renderPage(curPage - 1);
      }

      btnZoomIn.addEventListener('click', () => applyZoom(currentZoomMultiplier + 0.2));
      btnZoomOut.addEventListener('click', () => applyZoom(currentZoomMultiplier - 0.2));
      btnZoomFit.addEventListener('click', () => applyZoom(1.0));

      // Handle window resize smoothly
      let resizeTimer = null;
      window.addEventListener('resize', () => {
        if (resizeTimer) clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
          if (pdfDoc && pageViewports[1]) {
            applyZoom(currentZoomMultiplier);
          }
        }, 300);
      });

      // Load Document with PDF.js Range Streaming
      async function loadPdfDocument(targetUrl) {
        const loadingTask = pdfjsLib.getDocument({
          url: targetUrl,
          cMapUrl: '/pdfjs/cmaps/',
          cMapPacked: true,
          standardFontDataUrl: '/pdfjs/standard_fonts/',
          enableXfa: false,
          disableAutoFetch: true, // Only fetch visible byte ranges for instant response!
          disableStream: false,
          rangeChunkSize: 65536,
        });

        return await loadingTask.promise;
      }

      async function startViewer() {
        // Show fallback link if network is slow after 3 seconds
        const fallbackTimer = setTimeout(() => {
          if (btnSlowFallback) btnSlowFallback.style.display = 'block';
        }, 3000);

        try {
          // Attempt 1: Load via high-speed CDN URL
          try {
            pdfDoc = await loadPdfDocument(primaryUrl);
          } catch (cdnErr) {
            console.warn('CDN load failed, retrying with raw URL:', cdnErr);
            if (primaryUrl !== secondaryUrl) {
              pdfDoc = await loadPdfDocument(secondaryUrl);
            } else {
              throw cdnErr;
            }
          }

          clearTimeout(fallbackTimer);
          totalPages = pdfDoc.numPages;
          totalPagesNumEl.textContent = totalPages;

          // Fetch first page to measure layout
          const firstPage = await pdfDoc.getPage(1);
          const firstViewport = firstPage.getViewport({ scale: 1.0 });
          pageViewports[1] = firstViewport;

          // Setup all page placeholders
          setupPlaceholders(firstViewport);

          // Render Page 1 immediately
          await renderPage(1);

          // Hide loading overlay as soon as Page 1 is visible
          loadingOverlay.classList.add('hidden');
          toolbar.style.display = 'flex';

          // Track scrolling
          setupScrollTracking();
        } catch (err) {
          clearTimeout(fallbackTimer);
          console.error('PDF.js loading failed:', err);

          // Worker failure retry on main thread
          if (pdfjsLib && pdfjsLib.GlobalWorkerOptions && pdfjsLib.GlobalWorkerOptions.workerSrc) {
            try {
              console.log('Retrying without web worker...');
              pdfjsLib.GlobalWorkerOptions.workerSrc = '';
              pdfDoc = await loadPdfDocument(secondaryUrl);
              totalPages = pdfDoc.numPages;
              totalPagesNumEl.textContent = totalPages;
              const firstPage = await pdfDoc.getPage(1);
              const firstViewport = firstPage.getViewport({ scale: 1.0 });
              pageViewports[1] = firstViewport;
              setupPlaceholders(firstViewport);
              await renderPage(1);
              loadingOverlay.classList.add('hidden');
              toolbar.style.display = 'flex';
              setupScrollTracking();
              return;
            } catch (retryErr) {
              console.error('Main thread retry also failed:', retryErr);
            }
          }

          showError('تعذر عرض الملف داخل المعاينة السريعة. يمكنك فتح الملف مباشرة أو عبر عارض Google.');
        }
      }

      startViewer();
    })();
  </script>
</body>
</html>
